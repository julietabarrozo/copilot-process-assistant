kind: AdaptativeDialog
beginDialog: 
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries: 
      - Hi
      - Hello
      - Hey
      - Hola
    actions: 
      - kind: SendActivity
        id: sendMessage_greeting
        activity: 
          text: "Hello, I'm {System.Bot.Name}. How can I help you today? 
          speak: "Hello and thank you for calling {System.Bot.Name}. Please note that some responses are generated by AI and may require verification for accuracy. How may I help you today? 
      - kind: BeginDialog
        id: start_search_flow
        dialog: copilot_process_assistant.topic.Searc
